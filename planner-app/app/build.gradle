plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fredkv.planner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fredkv.planner'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            storeFile file('planer.keystore')
            storePassword 'planer123'
            keyAlias 'planer'
            keyPassword 'planer123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
