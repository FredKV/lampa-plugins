name: Build "Танічка" APK

on:
  push:
    paths:
      - 'planner-app/**'
      - '.github/workflows/planer-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Tanichka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tanichka-apk
          path: planner-app/Tanichka.apk

      - name: Publish to Releases
        if: ${{ !contains(github.event.head_commit.message, '[wip]') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: planer-latest
          name: "Танічка🦝 — остання збірка"
          body: |
            Завантажте **Tanichka.apk** на телефон і встановіть (дозвольте встановлення з невідомих джерел).
            Збірка №${{ github.run_number }}, коміт ${{ github.sha }}.
          files: planner-app/Tanichka.apk
          make_latest: true
